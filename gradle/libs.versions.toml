retrofit = "3.0.0"
okhttp = "5.5.0"
serializationJson = "1.11.0"
camerax = "1.6.2"
mlkitBarcode = "17.3.0"
zxing = "3.5.4"

junit = "4.13.2"
turbine = "1.2.1"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
